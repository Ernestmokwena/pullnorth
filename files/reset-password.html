<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - PullNorth</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background-color: #0A0A0A;
            color: #F9FAFB;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }
        
        .bg-effect {
            position: fixed;
            pointer-events: none;
            overflow: hidden;
            inset: 0;
            z-index: -1;
        }
        
        .blob-1 {
            position: absolute;
            top: -96px;
            right: -96px;
            width: 384px;
            height: 384px;
            background-color: rgba(79, 70, 229, 0.1);
            border-radius: 50%;
            filter: blur(100px);
        }
        
        .blob-2 {
            position: absolute;
            bottom: -96px;
            left: -96px;
            width: 384px;
            height: 384px;
            background-color: rgba(168, 85, 247, 0.1);
            border-radius: 50%;
            filter: blur(100px);
        }
        
        .bottom-gradient {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(79, 70, 229, 0.5), transparent);
            filter: blur(2px);
            opacity: 0.5;
        }
        
        .reset-container {
            width: 100%;
            max-width: 420px;
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .logo-circle {
            width: 64px;
            height: 64px;
            background-color: #FFFFFF;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
        
        .logo-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .logo-title {
            font-size: 1.875rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 0.25rem;
        }
        
        .logo-subtitle {
            font-size: 0.875rem;
            color: #94A3B8;
        }
        
        .reset-card {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(10px);
        }
        
        .reset-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #4F46E5, #8B5CF6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .reset-subtitle {
            font-size: 0.875rem;
            color: #94A3B8;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94A3B8;
            margin-bottom: 0.5rem;
            margin-left: 0.25rem;
        }
        
        .form-input {
            width: 100%;
            height: 56px;
            padding: 0 1rem;
            background-color: #121212;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 1rem;
            transition: all 0.2s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #4F46E5;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }
        
        .form-input::placeholder {
            color: #64748B;
        }
        
        .error-message {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }
        
        .success-message {
            color: #10b981;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }
        
        .submit-btn {
            width: 100%;
            height: 56px;
            background-color: #FFFFFF;
            color: #000000;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
            box-shadow: 0 10px 15px rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
            position: relative;
        }
        
        .submit-btn:hover:not(.loading) {
            opacity: 0.9;
            transform: scale(0.99);
        }
        
        .submit-btn:active:not(.loading) {
            transform: scale(0.98);
        }
        
        .loading {
            opacity: 0.7;
            pointer-events: none;
        }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            border-top-color: #000;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .login-link {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.875rem;
            color: #94A3B8;
        }
        
        .login-btn {
            color: #4F46E5;
            font-weight: 600;
            text-decoration: none;
            background: none;
            border: none;
            font-family: inherit;
            font-size: inherit;
            padding: 0;
            cursor: pointer;
        }
        
        .login-btn:hover {
            text-decoration: underline;
        }
        
        .token-message {
            background-color: rgba(79, 70, 229, 0.1);
            border: 1px solid rgba(79, 70, 229, 0.3);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            color: #94A3B8;
            display: none;
        }
        
        .token-message.success {
            background-color: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: #10b981;
        }
        
        .token-message.error {
            background-color: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }
        
        .logo-fallback {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4F46E5, #8B5CF6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
        
        @media (max-width: 480px) {
            .reset-container {
                padding: 1rem;
            }
            
            .reset-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-effect">
        <div class="blob-1"></div>
        <div class="blob-2"></div>
    </div>
    
    <div class="reset-container">
        <div class="logo-section">
            <div class="logo-circle">
                <img src="../pullnorth.png" alt="pullnorth logo" class="logo-img" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'logo-fallback\'>PN</div>'">
            </div>
            <h1 class="logo-title">pullnorth</h1>
            <p class="logo-subtitle">Reset your password</p>
        </div>
        
        <div class="reset-card">
            <h2 class="reset-title">Set New Password</h2>
            <p class="reset-subtitle">Enter your new password below to reset your account access.</p>
            
            <div id="token-message" class="token-message">
                <!-- Token status will be shown here -->
            </div>
            
            <form id="reset-form">
                <div class="form-group">
                    <label for="new-password" class="form-label">New Password</label>
                    <input type="password" id="new-password" class="form-input" placeholder="••••••••" required minlength="8">
                    <div id="password-error" class="error-message"></div>
                </div>
                
                <div class="form-group">
                    <label for="confirm-password" class="form-label">Confirm Password</label>
                    <input type="password" id="confirm-password" class="form-input" placeholder="••••••••" required minlength="8">
                    <div id="confirm-error" class="error-message"></div>
                </div>
                
                <button type="submit" class="submit-btn" id="reset-btn">
                    <span>Reset Password</span>
                </button>
                
                <div id="reset-success" class="success-message"></div>
            </form>
            
            <p class="login-link">
                Remember your password? 
                <button type="button" class="login-btn" id="go-to-login">Log In</button>
            </p>
        </div>
    </div>
    
    <div class="bottom-gradient"></div>

    <script>
        const API_URL = window.location.origin;
        let accessToken = null;

        // Extract token from URL hash
        function extractTokenFromHash() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            accessToken = params.get('access_token');
            const expiresAt = params.get('expires_at');
            const tokenType = params.get('token_type');
            const type = params.get('type');

            const tokenMessage = document.getElementById('token-message');
            
            if (accessToken && type === 'recovery') {
                // Check if token is expired
                const now = Math.floor(Date.now() / 1000);
                if (expiresAt && now > parseInt(expiresAt)) {
                    tokenMessage.textContent = 'This password reset link has expired. Please request a new one.';
                    tokenMessage.className = 'token-message error';
                    tokenMessage.style.display = 'block';
                    accessToken = null;
                } else {
                    tokenMessage.textContent = '✓ Valid reset link detected. Please enter your new password.';
                    tokenMessage.className = 'token-message success';
                    tokenMessage.style.display = 'block';
                }
            } else {
                tokenMessage.textContent = 'Invalid or missing password reset link. Please request a new reset link from the login page.';
                tokenMessage.className = 'token-message error';
                tokenMessage.style.display = 'block';
            }
        }

        // Function to show error
        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
        }

        // Function to show success
        function showSuccess(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
        }

        // Hide all messages
        function hideAllMessages() {
            document.querySelectorAll('.error-message, .success-message').forEach(msg => {
                msg.style.display = 'none';
            });
        }

        // Set loading state
        function setLoading(button, isLoading) {
            if (isLoading) {
                button.classList.add('loading');
                button.innerHTML = '<div class="spinner"></div>';
                button.disabled = true;
            } else {
                button.classList.remove('loading');
                button.innerHTML = '<span>Reset Password</span>';
                button.disabled = false;
            }
        }

        // Handle form submission
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const resetBtn = document.getElementById('reset-btn');
            
            hideAllMessages();
            
            // Validate inputs
            if (!accessToken) {
                showError('password-error', 'Invalid or expired reset link. Please request a new one.');
                return;
            }
            
            if (!newPassword) {
                showError('password-error', 'New password is required');
                return;
            }
            
            if (newPassword.length < 8) {
                showError('password-error', 'Password must be at least 8 characters');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showError('confirm-error', 'Passwords do not match');
                return;
            }
            
            setLoading(resetBtn, true);
            
            try {
                const response = await fetch(`${API_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: accessToken,
                        password: newPassword
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showSuccess('reset-success', 'Password reset successfully! Redirecting to login...');
                    
                    // Clear form
                    document.getElementById('new-password').value = '';
                    document.getElementById('confirm-password').value = '';
                    
                    // Update token message
                    const tokenMessage = document.getElementById('token-message');
                    tokenMessage.textContent = '✓ Password reset successful! Redirecting to login...';
                    tokenMessage.className = 'token-message success';
                    
                    // Redirect to login after delay
                    setTimeout(() => {
                        window.location.href = '/auth';
                    }, 2000);
                } else {
                    showError('password-error', data.error || 'Failed to reset password. The link may have expired.');
                }
            } catch (error) {
                showError('password-error', 'Network error. Please check your connection.');
            } finally {
                setLoading(resetBtn, false);
            }
        });

        // Go to login button
        document.getElementById('go-to-login').addEventListener('click', () => {
            window.location.href = '/auth';
        });

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            extractTokenFromHash();
        });
    </script>
</body>
</html>
